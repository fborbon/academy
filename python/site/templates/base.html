<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:type" content="website">
  <meta property="og:url" content="$canonical">
  <link rel="canonical" href="$canonical">
  <link rel="icon" href="data:image/svg+xml,$favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="${assets}assets/site.css">
  <link rel="stylesheet" href="${assets}assets/pygments.css">
  <script>
    try { var t = localStorage.getItem("nn1001-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>$extra_head
</head>
<body>
  <header class="topbar">
    <a class="brand" href="${prefix}"><span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="28" height="28"><rect width="64" height="64" rx="14" fill="currentColor"/><text x="32" y="42" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="26" font-weight="700" fill="#fff">py</text></svg>
    </span><span class="notranslate" translate="no">$course_html</span></a>
    <nav class="topnav" aria-label="Site">
      <a href="https://www.forwardforecasting.eu/">$nav_projects</a>
      <a href="$field_notes">Field Notes</a>
      <a href="$repo" target="_blank" rel="noopener">GitHub</a>
$lang_switch      <button class="theme-toggle" type="button" aria-label="$toggle_theme" title="$toggle_theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>
$body
  <footer class="footer">
    <p>$footer_data</p>
    <p class="notranslate" translate="no">Built by fborbon · Forward Forecasting © $year</p>
  </footer>
  <script>window.NN1001_I18N = $i18n_json;</script>
  <script src="${assets}assets/site.js"></script>
  <script defer src="https://www.forwardforecasting.eu/assets/translate-widget.js"></script>
</body>
</html>
