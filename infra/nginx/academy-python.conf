# Python 1001 course site (static, synced into the Landing checkout under academy/python)
# Installed on the host as /etc/nginx/sites-available/academy-python.conf (+ symlink in sites-enabled);
# the TLS lines were added by certbot (2026-10-18).
server {
    server_name python.academy.forwardforecasting.eu;

    root /var/www/forwardforecasting/academy/python;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/x-ipynb+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location /notebooks/ {
        types { application/x-ipynb+json ipynb; }
        add_header Content-Disposition "attachment";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/python.academy.forwardforecasting.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/python.academy.forwardforecasting.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = python.academy.forwardforecasting.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name python.academy.forwardforecasting.eu;

    listen 80;
    return 404; # managed by Certbot


}