# Python 1001 course site (static, synced into the Landing checkout under academy/python)
# Installed on the host as /etc/nginx/sites-available/academy-python.conf (+ symlink in sites-enabled);
# certbot adds the TLS lines below the first server block.
server {
    server_name python.academy.forwardforecasting.eu;

    root /var/www/forwardforecasting/academy/python;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/x-ipynb+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location /notebooks/ {
        types { application/x-ipynb+json ipynb; }
        add_header Content-Disposition "attachment";
    }

    listen 80;
}
