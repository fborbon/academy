# Academy home page: the course catalogue (static, synced into the Landing checkout under academy/home)
# Installed on the host as /etc/nginx/sites-available/academy-home.conf (+ symlink in sites-enabled);
# the TLS lines and the http -> https redirect were added by certbot (2026-10-19).
server {
    server_name academy.forwardforecasting.eu;

    root /var/www/forwardforecasting/academy/home;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/academy.forwardforecasting.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/academy.forwardforecasting.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = academy.forwardforecasting.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name academy.forwardforecasting.eu;
    return 404; # managed by Certbot


}
