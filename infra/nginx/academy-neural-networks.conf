# Neural Networks 1001 course site (static, synced into the Landing checkout under academy/neural-networks)
server {
    server_name neural-networks.academy.forwardforecasting.eu;

    root /var/www/forwardforecasting/academy/neural-networks;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/x-ipynb+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location /notebooks/ {
        types { application/x-ipynb+json ipynb; }
        add_header Content-Disposition "attachment";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/neural-networks.academy.forwardforecasting.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/neural-networks.academy.forwardforecasting.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = neural-networks.academy.forwardforecasting.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name neural-networks.academy.forwardforecasting.eu;
    return 404; # managed by Certbot


}